name: Projekt prüfen
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Dokumentation prüfen
        run: python3 tools/check_docs.py
      - name: Öffentlichen Dateibestand prüfen
        run: python3 tools/check_repository.py
      - name: Abhängigkeiten installieren
        run: |
          python3 -m venv .test-env
          .test-env/bin/python -m pip install -r requirements.txt
      - name: Python prüfen
        run: .test-env/bin/python -m unittest discover -s tests -v
      - name: TV-Bedienung prüfen
        run: |
          node tests/test_tv_navigation.cjs
          node tests/test_telemetry_view.cjs
          node tests/test_tv_remote.cjs
