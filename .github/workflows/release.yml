name: Container veröffentlichen
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Abhängigkeiten installieren
        run: |
          python3 -m venv .test-env
          .test-env/bin/python -m pip install -r requirements.txt
      - name: Anwendung prüfen
        run: .test-env/bin/python -m unittest discover -s tests -v
      - name: TV-Navigation prüfen
        run: |
          node tests/test_tv_navigation.cjs
          node tests/test_telemetry_view.cjs
          node tests/test_tv_remote.cjs
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image-Namen vorbereiten
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          push: true
          platforms: linux/arm/v7,linux/arm64,linux/amd64
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.description=UniFi Protect TV dashboard with Raspberry Pi GPIO and HDMI-CEC services
      - name: Prozessorvarianten prüfen
        run: |
          docker buildx imagetools inspect "$IMAGE:$GITHUB_REF_NAME" --raw > image-index.json
          python3 - <<'PY'
          import json
          index=json.load(open('image-index.json'))
          platforms=[entry.get('platform',{}) for entry in index.get('manifests',[])]
          assert any(p.get('architecture')=='arm' and p.get('variant')=='v7' for p in platforms), 'ARMv7 fehlt'
          assert any(p.get('architecture')=='arm64' for p in platforms), 'ARM64 fehlt'
          assert any(p.get('architecture')=='amd64' for p in platforms), 'AMD64 fehlt'
          print('ARMv7, ARM64 und AMD64 im veröffentlichten Image bestätigt.')
          PY
      - name: GitHub-Release anlegen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > release-notes.md <<EOF
          Kamerablick $GITHUB_REF_NAME

          Container: \`$IMAGE:$GITHUB_REF_NAME\`

          Enthält Varianten für ARMv7 (Pi 2B/32 Bit), ARM64 und AMD64.

          [Pi-2-Installation](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/PI2.md)
          · [Geräteabnahme und Grenzen](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/ABNAHME.md)

          Das Dashboard läuft in Docker. Taster, HDMI-CEC, Kiosk und Videoplayer laufen als Pi-Dienste.
          EOF
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "Kamerablick $GITHUB_REF_NAME" --notes-file release-notes.md
          fi
