<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#17191b"><title>Kamerablick · TV</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg"><link rel="stylesheet" href="/tv.css">
</head>
<body>
<svg class="symbols" aria-hidden="true"><symbol id="camera-glyph" viewBox="0 0 32 32"><rect x="3" y="8" width="26" height="19" rx="4"/><path d="m10 8 2-3h8l2 3"/><circle cx="16" cy="17" r="6"/></symbol></svg>
<header><div class="brand"><img src="/icon.svg" alt="" width="42" height="42">Kamerablick</div><span id="demo-badge" class="badge" hidden>Vorschau</span><time id="clock" aria-label="Uhrzeit"></time></header>
<main>
  <section id="pairing" class="message-panel" hidden>
    <h1>Bitte um Hilfe bitten</h1><p>Die TV-Ansicht muss noch eingerichtet werden.</p>
    <a class="plain-button secondary" data-nav="setup" href="/">Einrichtung öffnen</a>
  </section>
  <section id="home" hidden>
    <h1>Welche Kamera?</h1>
    <div id="tv-cameras" class="camera-grid" role="group" aria-label="Kameras"></div>
    <div id="empty-state" class="empty-state"><p id="empty-message">Kameras werden geladen …</p></div>
    <p id="connection-hint" class="connection-hint" role="status"></p>
    <div class="bottom-actions"><button id="power" class="power-button" data-nav="power"><span aria-hidden="true">⏻</span> Fernseher ausschalten</button></div>
  </section>
  <section id="viewing" class="message-panel" hidden>
    <svg class="view-icon" aria-hidden="true"><use href="#camera-glyph"/></svg>
    <h1 id="viewing-title">Kamera</h1><p id="viewing-description" role="status">Kamera wird verbunden …</p>
    <button class="plain-button" id="back-to-menu" data-nav="back-to-menu">Kamera wechseln</button>
  </section>
  <section id="sleeping" class="message-panel" hidden>
    <h1>Ausschalten …</h1><p id="sleep-message"></p>
    <button class="plain-button secondary" id="wake" data-nav="wake">Zur Kameraauswahl</button>
  </section>
</main>
<footer id="key-hint">Pfeiltasten: auswählen <span aria-hidden="true">·</span> OK: ansehen</footer>
<dialog id="power-dialog" aria-labelledby="power-title">
  <h2 id="power-title">Fernseher ausschalten?</h2>
  <div class="dialog-buttons"><button class="plain-button secondary" data-nav="cancel-power" id="cancel-power">Nein, zurück</button><button class="plain-button" data-nav="confirm-power" id="confirm-power">Ja, ausschalten</button></div>
</dialog>
<div id="notice" role="status" hidden></div>
<script src="/tv-navigation.js"></script><script src="/tv-remote.js"></script><script src="/tv.js"></script>
</body></html>
