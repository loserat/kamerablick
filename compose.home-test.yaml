services:
  dashboard:
    image: ghcr.io/loserat/kamerablick:v0.1.3
    restart: unless-stopped
    environment:
      HOME_TEST_MODE: 'true'
      DEMO_MODE: 'true'
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?Bitte ein eigenes Dashboard-Passwort in .env setzen}
      APP_VERSION: v0.1.3
      DATA_DIR: /data
      BIND: 0.0.0.0
      PORT: '8088'
    ports:
      - '127.0.0.1:${HOME_TEST_PORT:-8088}:8088'
    volumes:
      - home-test-settings:/data
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/healthz',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      options:
        max-size: 5m
        max-file: '2'
volumes:
  home-test-settings:
